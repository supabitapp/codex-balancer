<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add account</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{waterCSSURL}}">
</head>
<body>
<main>
<h1>Add an account</h1>
<p>Open the sign-in page and enter this one-time code.</p>
<pre><code>{{.UserCode}}</code></pre>
<p><a href="{{.VerificationURL}}" target="_blank" rel="noreferrer">Open sign-in</a></p>
<p>The code expires in {{.ExpiresIn}} minutes. The account will appear in <a href="/stats">stats</a> after sign-in.</p>
</main>
</body>
</html>
