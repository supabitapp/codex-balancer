<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add account</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{waterCSSURL}}">
<link rel="stylesheet" href="{{dashboardAssetURL "accounts.css"}}">
</head>
<body>
<main>
<h1>Add an account</h1>
<p class="lead">Copy this code, then open sign-in and paste it.</p>
<p>Adding this account turns off model training for it.</p>
<button class="code" type="button" data-copy-code="{{.UserCode}}">
<span>{{.UserCode}}</span>
<small>Click to copy</small>
</button>
<a class="sign-in" href="{{.VerificationURL}}" target="_blank" rel="noreferrer">Open sign-in</a>
</main>
<script src="{{dashboardAssetURL "accounts.js"}}"></script>
</body>
</html>
